[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "president-country-bot"
version = "1.0.0"
description = "Transactional Telegram country strategy game"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "SQLAlchemy[asyncio]>=2.0.43,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "python-dotenv>=1.1,<2",
  "tzdata==2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["game*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
